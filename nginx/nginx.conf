# Reverse proxy / load balancer for the local multi-instance demo.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  upstream api {
    # Round-robin (nginx default). Passive health checks: a replica that fails
    # 3 times is taken out of rotation for 10s. (Active health checks require
    # nginx Plus; Docker's own healthcheck covers liveness here.)
    server api-1:4000 max_fails=3 fail_timeout=10s;
    server api-2:4000 max_fails=3 fail_timeout=10s;
    # Reuse upstream connections instead of a TCP handshake per request.
    keepalive 32;
  }

  server {
    listen 80;

    # Matches the API body limit plus headroom; images never pass through the
    # API (they go straight to Supabase Storage via signed URLs).
    client_max_body_size 1m;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Correlates nginx and API logs (accepted by the API's request-id middleware).
      proxy_set_header X-Request-Id $request_id;

      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;

      # Retry another replica only for safe failures; never replay a POST/PATCH
      # that may already have been processed (non_idempotent is NOT listed).
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;

      # Shows which replica served the request (demo/debugging aid).
      add_header X-Upstream $upstream_addr always;
    }
  }
}
