# Supabase CLI configuration for LOCAL development (`supabase start`).
# Hosted project settings (email confirmation, CAPTCHA, redirect URLs) must be
# mirrored in the Supabase dashboard; see the root README "Manual configuration".
project_id = "muranga-service-requests"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 100

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
# Unverified users cannot sign in, and RLS additionally blocks their inserts.
enable_confirmations = true
secure_password_change = true
